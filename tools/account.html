<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make a sign-in account</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1f1d1a; background: #f6f3ee; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cfc8bd; border-radius: 8px; font: inherit; }
    textarea { height: 170px; font-family: ui-monospace, monospace; font-size: 12px; }
    button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px; background: #1f1d1a; color: #fff; font: inherit; cursor: pointer; }
    p { color: #5d574e; }
  </style>
</head>
<body>
  <h1>Make a sign-in account</h1>
  <p>Encrypts a GitHub fine-grained access key (Contents: read and write on the data repo only) with a
    username and password. Paste the result into <code>ACCOUNTS</code> in <code>js/config.js</code>.
    Nothing leaves this page.</p>
  <form>
    <label>Username <input name="username" required autocapitalize="none"></label>
    <label>Password <input name="password" type="password" required></label>
    <label>GitHub access key <input name="token" type="password" required placeholder="github_pat_…"></label>
    <button>Make account entry</button>
  </form>
  <label>Paste into ACCOUNTS</label>
  <textarea readonly></textarea>
  <script type="module">
    import { sealToken } from '../js/store.js';
    const form = document.querySelector('form');
    form.onsubmit = async e => {
      e.preventDefault();
      const username = form.username.value.trim();
      const sealed = await sealToken(username, form.password.value, form.token.value.trim());
      document.querySelector('textarea').value =
        `  ${JSON.stringify(username.toLowerCase())}: ${JSON.stringify({ name: username, ...sealed }, null, 4).replace(/\n/g, '\n  ')},`;
      form.token.value = '';
    };
  </script>
</body>
</html>
